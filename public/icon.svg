<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="60%" stop-color="#0e0720" />
      <stop offset="100%" stop-color="#06060c" />
    </radialGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with Rounded Border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#8b5cf6" stroke-width="6" stroke-opacity="0.5" />

  <!-- Shadow Monarch Core Aura -->
  <circle cx="256" cy="256" r="160" fill="#7c3aed" fill-opacity="0.15" filter="url(#shadowGlow)" />
  
  <!-- Outer Runic Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#a78bfa" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="16 12" />

  <!-- Monarch Crown / Gate Wings Symbol -->
  <g filter="url(#shadowGlow)">
    <!-- Central Rising Blade / Monolith -->
    <path d="M 256 90 L 290 220 L 330 260 L 256 420 L 182 260 L 222 220 Z" fill="url(#bladeGrad)" stroke="#c084fc" stroke-width="4" />
    <!-- Center Core Glow Line -->
    <line x1="256" y1="110" x2="256" y2="400" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Left Wing Dagger -->
    <path d="M 170 170 L 220 220 L 190 320 L 130 250 Z" fill="url(#purpleGlow)" opacity="0.9" />
    <!-- Right Wing Dagger -->
    <path d="M 342 170 L 382 250 L 322 320 L 292 220 Z" fill="url(#purpleGlow)" opacity="0.9" />

    <!-- Monarch Eyes / Purple Sparks -->
    <polygon points="236,230 248,240 236,250 224,240" fill="#67e8f9" />
    <polygon points="276,230 288,240 276,250 264,240" fill="#67e8f9" />

    <!-- Top Crown Spikes -->
    <polygon points="256,60 268,100 244,100" fill="#c084fc" />
    <polygon points="196,110 216,140 186,145" fill="#a855f7" />
    <polygon points="316,110 326,145 296,140" fill="#a855f7" />
  </g>

  <!-- Bottom Runes / Level System Accent -->
  <text x="256" y="468" text-anchor="middle" font-family="Cinzel, Outfit, sans-serif" font-weight="800" font-size="28" fill="#c084fc" letter-spacing="8">SHADOWRISE</text>
</svg>
