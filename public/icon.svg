<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient: Pure Pitch Black & Obsidian Core to Deep Purple Edge -->
    <radialGradient id="bgObsidian" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#040208" />
      <stop offset="65%" stop-color="#080312" />
      <stop offset="100%" stop-color="#150628" />
    </radialGradient>

    <!-- Electric Purple & Violet Glow -->
    <linearGradient id="electricViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e9d5ff" />
      <stop offset="55%" stop-color="#c084fc" />
      <stop offset="85%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <!-- Dark Blade Bevel Gradient -->
    <linearGradient id="bladeBevel" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="45%" stop-color="#a855f7" />
      <stop offset="80%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <!-- Halo & Rune Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="ambientHalo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" result="blur" />
    </filter>
  </defs>

  <!-- Background Base with Squircle Border -->
  <rect width="512" height="512" rx="116" fill="url(#bgObsidian)" />
  <rect width="506" height="506" x="3" y="3" rx="113" fill="none" stroke="#9333ea" stroke-width="4" stroke-opacity="0.6" />
  <rect width="498" height="498" x="7" y="7" rx="109" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Ambient Deep Violet Aura -->
  <circle cx="256" cy="256" r="170" fill="#7e22ce" fill-opacity="0.28" filter="url(#ambientHalo)" />
  <circle cx="256" cy="256" r="90" fill="#c084fc" fill-opacity="0.15" filter="url(#intenseGlow)" />

  <!-- Circular Energy Ring Behind the Symbol with Runic Notches -->
  <g filter="url(#intenseGlow)">
    <!-- Outer Glow Ring -->
    <circle cx="256" cy="256" r="184" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.8" />
    <!-- Secondary Dashed Runic Circle -->
    <circle cx="256" cy="256" r="168" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="14 10 4 10" />
    <!-- Inner Concentric Ring -->
    <circle cx="256" cy="256" r="148" fill="none" stroke="#7e22ce" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Runic Cardinal Gate Points -->
    <polygon points="256,66 261,78 251,78" fill="#e9d5ff" />
    <polygon points="256,446 261,434 251,434" fill="#e9d5ff" />
    <polygon points="66,256 78,251 78,261" fill="#e9d5ff" />
    <polygon points="446,256 434,251 434,261" fill="#e9d5ff" />
  </g>

  <!-- Floating Purple Particles / Embers -->
  <g fill="#c084fc" opacity="0.8">
    <circle cx="160" cy="140" r="3" />
    <circle cx="360" cy="145" r="3.5" />
    <circle cx="130" cy="310" r="2.5" />
    <circle cx="375" cy="350" r="3.2" />
    <circle cx="295" cy="115" r="2" />
    <circle cx="215" cy="395" r="2.5" />
    <polygon points="340,195 344,200 340,205 336,200" fill="#e9d5ff" />
    <polygon points="175,225 178,229 175,233 172,229" fill="#e9d5ff" />
  </g>

  <!-- Large Stylized Shadow Monarch Blade "S" Emblem -->
  <!-- Designed with sharp geometric angles, dagger facets, and high contrast -->
  <g filter="url(#intenseGlow)">
    <!-- Base S Silhouette & Blade Wings -->
    <!-- Top Bar of S (Angular Blade Sweep) -->
    <path d="M 370 135 
             L 210 135 
             L 175 175 
             L 175 225 
             L 295 245 
             L 335 270 
             L 335 340 
             L 275 375 
             L 142 375 
             L 125 410 
             L 302 410 
             L 380 345 
             L 380 255 
             L 255 230 
             L 220 210 
             L 220 172 
             L 388 172 Z"
          fill="url(#bladeBevel)"
          stroke="#c084fc"
          stroke-width="3"
          stroke-linejoin="round" />

    <!-- Core Electric Violet Highlight Facet -->
    <path d="M 365 142 
             L 216 142 
             L 185 177 
             L 185 218 
             L 298 238 
             L 342 265 
             L 342 335 
             L 280 368 
             L 155 368 
             L 140 395 
             L 295 395 
             L 368 335 
             L 368 262 
             L 248 238 
             L 212 215 
             L 212 178 
             L 378 178 Z"
          fill="url(#electricViolet)"
          opacity="0.9" />

    <!-- Center White-Hot Core Blade Edge / Spine -->
    <path d="M 355 152 
             L 230 152 
             L 200 185 
             L 200 205 
             L 305 228 
             L 352 258 
             L 352 325 
             L 290 355 
             L 175 355" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          opacity="0.95" />

    <!-- Top & Bottom Dagger Accents / Spearheads on the S -->
    <polygon points="370,135 410,135 388,172" fill="#e9d5ff" />
    <polygon points="142,375 102,410 125,410" fill="#e9d5ff" />
  </g>
</svg>
